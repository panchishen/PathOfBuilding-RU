# Русская локализация: регулярно вливает upstream (PathOfBuildingCommunity/PathOfBuilding, ветка dev)
# в ветку ru. Если upstream обновил движок или шрифты, либо слияние конфликтует, ничего не
# вливает и открывает issue: движок нужно пересобрать с правкой из PathOfBuilding-SimpleGraphic-RU.
name: RU - синхронизация с upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ru-sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout ru
        uses: actions/checkout@v5
        with:
          ref: ru
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/PathOfBuildingCommunity/PathOfBuilding.git
          git fetch --no-tags upstream dev

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD upstream/dev)
          engine=$(git diff --name-only "$base" upstream/dev -- runtime/SimpleGraphic.dll runtime/SimpleGraphic/Fonts | head -20)
          if [ -n "$engine" ]; then
            echo "state=engine" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$engine"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit -m "Слияние upstream/dev $(git rev-parse --short upstream/dev)" upstream/dev; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            conflicts=$(git diff --name-only --diff-filter=U | head -20)
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$conflicts"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.merge.outputs.state == 'merged'
        run: git push origin HEAD:ru

      - name: Report untranslated UI strings
        if: steps.merge.outputs.state == 'merged'
        run: |
          python3 ru/tools/extract_ui_strings.py > ui_new.txt
          count=$(grep -c . ui_new.txt || true)
          echo "Новых строк интерфейса без перевода: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            title="Новые строки интерфейса без перевода"
            body=$(printf 'После слияния upstream %s появилось строк без перевода: %s.\n\n```\n%s\n```' \
              "$(git rev-parse --short upstream/dev)" "$count" "$(head -200 ui_new.txt)")
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi

      - name: Open issue
        if: steps.merge.outputs.state == 'engine' || steps.merge.outputs.state == 'conflict'
        env:
          STATE: ${{ steps.merge.outputs.state }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          if [ "$STATE" = "engine" ]; then
            title="Upstream обновил движок или шрифты: нужна пересборка"
            text="Upstream изменил движок (runtime/SimpleGraphic.dll) или шрифты. Автослияние остановлено: нужно пересобрать PathOfBuilding-SimpleGraphic-RU на новой версии движка, перегенерировать шрифты (ru/tools/gen_fonts.py) и влить upstream вручную."
          else
            title="Конфликт при слиянии upstream"
            text="Автоматическое слияние upstream/dev в ru дало конфликты, слияние отменено. Нужно влить вручную."
          fi
          body=$(printf '%s\n\nUpstream: %s\n\nФайлы:\n```\n%s\n```' "$text" "$(git rev-parse --short upstream/dev)" "$FILES")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
